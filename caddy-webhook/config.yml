name: "caddy-webhook"
version: "1.1.0"
slug: "caddy_webhook"
description: "An overcomplicated addon to handle specific webhooks from GitHub etc: Caddyfile updates and Wall Dash deploys"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
options:
  logfire_token: null
  discord_webhook_url: null
  notify_discord_user: null
  github_webhook_secret: null
  caddy_container_name: d630ad5e_caddy-2
  git_repo_path: /share/caddy
  git_ssh_key_file: /ssl/.ssh/id_ed25519
  git_ssh_known_hosts_file: /ssl/.ssh/github.com.hostkey
  git_repo_url: https://github.com/caraar12345/infra-caddy
  git_repo_branch: main
  wall_dash_repo: caraar12345/home-assistant-wall-dash
  wall_dash_branch: main
  wall_dash_workflow: .github/workflows/deploy.yaml
  wall_dash_www_dir: /homeassistant/www/wall-dash
  wall_dash_integration_dir: /homeassistant/custom_components/wall_dash
  wall_dash_preview_dir: /share/wall-dash/pr
  wall_dash_preview_url: https://hass-new.adhd.energy/wall-dash/pr
schema:
  logfire_token: password
  discord_webhook_url: url
  notify_discord_user: int
  github_webhook_secret: password
  caddy_container_name: str
  git_repo_path: str
  git_ssh_key_file: str
  git_ssh_known_hosts_file: str
  git_repo_url: str
  git_repo_branch: str
  wall_dash_github_token: password?
  wall_dash_webhook_secret: password?
  wall_dash_repo: str
  wall_dash_branch: str
  wall_dash_workflow: str
  wall_dash_www_dir: str
  wall_dash_integration_dir: str
  wall_dash_preview_dir: str
  wall_dash_preview_url: url
image: "ghcr.io/caraar12345/caddy-webhook/hass-{arch}"
docker_api: true
homeassistant_api: true
map:
  - ssl
  - share:rw
  - homeassistant_config:rw
